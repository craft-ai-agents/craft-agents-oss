# 回归池:只收经过归因的真实生产故障。目标通过率 95-100%,发版闸门。
# 铁律:断言只写行为形状(工具选择/顺序/零错误)和稳定标识(型号),
# 绝不写易变业务值(价格/库存数/供应商名)——那是拿活数据铸死模具,eval 自己会烂。
# 口径对齐业务 SOP(AGENTS.md 找料流程):第 0 步允许 WebSearch 认料(≤3 次,
# 不作货源证据),所以不禁认料、只限量;禁的是"库存前上平台找货"(browserdepot)。
#
# 首批三条源自 2026-07-06 生产审计(121 次飞书工具调用,19 错):
#   norm(NULL) 引擎 bug ×14、斜杠列名裸写 ×4、SQL 通道整体 28% 错误率 → record-search 首选。

- id: reg-20260706-norm-variant-inventory-hit
  category: procurement_regression
  name: 回归|型号变体写法照样先查中本地库存(norm 归一 + NULL 行安全)
  input: 帮我查一下 mt41k 256m16tw-107 it:p 有没有现货
  metadata:
    source:
      failure: norm(NULL) 曾把整条查询打死(生产 14 次);变体归一是 norm 的本职
      fixedBy: larkdepot 9ae1a91(norm NULL 进 NULL 出)+ record-search 内建 norm 匹配
      observedAt: '2026-07-06'
  skillSlugs:
    - procurement-local-inventory-lookup
  expected:
    trace:
      inventoryFirst: true
      forbidPlatformBeforeInventory: true
      maxToolErrors: 0
      maxToolCalls: 14
      maxBashCalls: 8
      maxWebCalls: 3
    toolCalls:
      requiredSkills:
        - procurement-local-inventory-lookup
      requiredSearchTerms:
        - mt41k
    answer:
      requiredTerms:
        - MT41K256M16TW
      mustMentionInternalSource: true
  assertions:
    - type: code
      criterion: 小写带空格的型号变体必须命中本地库存(norm 归一),全程零工具错误;认料限量(≤3)、库存前不上平台

