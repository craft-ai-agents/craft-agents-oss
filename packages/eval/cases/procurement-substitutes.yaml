# 替代料 eval 用例。标准答案由业务确认(2026-06-24)。
#
# 判分:
#   - mustFind = 业务确认的标准替代(厂商 OPN)
#   - acceptable 起步 = mustFind + 复审补进的合理替代
#   - minPrecision: 0 — 不门 precision,precision 只记录
#   - forbidden 起步空,复审填

- id: alt-001-g6e134p
  name: 替代料 - G6E134P-US DC24V
  category: procurement_substitute
  input: 查找 G6E134P-US DC24V 的替代料
  context: &ctx >-
    完成查找后,只输出一个 ```substitutes 代码块,块内为合法 JSON,块后不得有任何文字。格式:
    {"original": "<原型号>", "substitutes": [{"mpn": "<OPN>", "type": "drop_in|param_compatible|downgrade", "reason": "<替代依据>"}]}
    规范:mpn 一律用厂商 datasheet 上的完整订货型号(OPN)原样书写,不加空格、品牌或备注;
    type 三选一(drop_in=pin对pin / param_compatible=参数兼容 / downgrade=降级可用);
    若无可替代,substitutes 给空数组。
  skillSlugs: &skills
    - procurement-alternative-search
    - procurement-model-info-search
    - procurement-platform-search
    - procurement-platform-search-more
    - procurement-part-mismatch-review
  expected:
    substitutes: { acceptable: ["G6S-2 DC24"], mustFind: ["G6S-2 DC24"], forbidden: [], minPrecision: 0 }
  assertions: &asserts
    - type: code
      criterion: 必须找到业务确认的替代料

