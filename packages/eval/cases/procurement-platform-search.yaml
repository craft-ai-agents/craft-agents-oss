# 平台查找 eval。只测外部采购平台采集/报价这一段。
# 方向: 查询全部平台、平台可用性、完全覆盖率、数据汇报精度。

- id: platform-search-001-mt53e512m32d1zw-046-aat-b
  name: 全平台查找 - MT53E512M32D1ZW-046 AAT:B
  category: procurement_platform_search
  input: "内部库存已确认无记录。请查询全部已接入采购平台，找 MT53E512M32D1ZW-046 AAT:B 的报价、库存和交期线索。"
  context: &platform_context >-
    本 case 只评估平台采集，不查本地库存、供应商档案、WebSearch 或 WebFetch。
    必须查询全部已接入的普通采购平台；若某平台访问受限、登录限制、连接失败或本次未取到，要按平台写成可用性/阻碍状态，不能写成无货。
    最终回答必须包含平台覆盖率、平台可用性汇总，以及命中数据的字段：平台、型号、品牌、库存、报价、交期。字段缺失时写未知/未提供，不要编造。
    这是无交互 headless eval；不要调用 ask_user / mcp__session__ask_user / 任何向用户提问或等待确认的工具。采集完成后直接输出最终报告。
    必须显式使用 engine.py --source "<source-id 逗号列表>" 列出要查的平台；不要省略 --source 触发隐式 all_ids，也不要把 --wait 提高到 30 这类全局长等待。
  skillSlugs: &platform_skill
    - scrape-engine
  metadata:
    focus: all_platform_search
    productType: memory
  expected:
    trace: &platform_trace
      requiresPlatformSearch: true
      maxToolCalls: 24
    toolCalls:
      requiredSkills:
        - scrape-engine
      requiredSearchTerms:
        - MT53E512M32D1ZW-046 AAT:B
      forbiddenTools: &platform_forbidden_tools
        - procurement-local-inventory-lookup
        - procurement-supplier-shortlist
        - WebSearch
        - WebFetch
    answer:
      requiredTerms:
        - MT53E512M32D1ZW-046 AAT:B
        - 覆盖率
        - 可用性
        - 平台
        - 报价
        - 交期
      forbiddenTerms: &platform_forbidden_terms
        - lark-cli
        - baseToken
        - tableId
        - API
        - command
        - 命令
        - scrape-engine
        - engine.py
        - cloakbrowser
        - WebFetch
        - WebSearch
        - source id
        - 爬虫
        - 脚本
    platform: &platform_contract
      sourceIds: &platform_sources
        - digikey
        - mouser
        - ickey
        - master
        - octopart
        - szlcsc-overseas
        - future
        - newark
        - rs-uk
        - rs-jp
        - rs-hk
        - rs-us
        - avnet
        - arrow
        - verical
        - element14-cn
        - tme
        - xonelec
        - componentonline
        - lcsc
        - szlcsc
        - jbchip
        - vanlinkon
        - peigenesis
        - darisus
        - heilind
        - sager
        - tti
        - rochester
        - misumi
        - misumi-jp
        - monotaro
        - corestaff
        - ocpneumatics
      requireAllSources: true
      allowImplicitAllSources: false
      minCoverageRatio: 1
      requireAvailabilityReport: true
      requiredStatusTerms:
        - 覆盖率
        - 可用性
        - 访问受限
        - 未取到
        - 维护
      requiredReportFields:
        - 平台
        - 状态
        - 库存
        - 报价
        - 交期
      requiredStructuredFields:
        - mpn
        - brand
        - stock
        - price_breaks
        - lead_time
      precisionSampleSize: 8
  assertions: &platform_assertions
    - type: code
      criterion: 必须查询全部普通采购平台，并计算实际覆盖率
    - type: code
      criterion: 必须区分平台可用、未命中、访问受限/未取到，不能把采集阻碍写成无货
    - type: code
      criterion: 必须保留 engine 结构化字段里的型号、品牌、库存、报价或交期值
    - type: manual
      criterion: 回答面向采购人员，只写平台结果和业务阻碍，不暴露采集实现

