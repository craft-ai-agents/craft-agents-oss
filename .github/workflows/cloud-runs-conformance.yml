name: cloud-runs-conformance

# Nightly contract guard (PRD F17): preview APIs at cloudflare/computer
# break silently; conformance catches it before users do.
on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Local provider leg
        run: bun test packages/cloud-runner/src/__tests__/local-provider.test.ts

      - name: Cloudflare leg
        env:
          CLOUD_RUNS_GATEWAY_URL: ${{ secrets.CLOUD_RUNS_CLOUDFLARE_GATEWAY_URL }}
          CLOUD_RUNS_TOKEN: ${{ secrets.CLOUD_RUNS_TOKEN }}
        run: bun test --timeout 600000 packages/cloud-runner/src/__tests__/cloudflare-provider.test.ts

      - name: Modal leg
        env:
          CLOUD_RUNS_GATEWAY_URL: ${{ secrets.CLOUD_RUNS_MODAL_GATEWAY_URL }}
          CLOUD_RUNS_TOKEN: ${{ secrets.CLOUD_RUNS_TOKEN }}
        run: bun test --timeout 600000 packages/cloud-runner/src/__tests__/cloudflare-provider.test.ts

      - name: File alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Cloud Runs conformance failed (nightly)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cloud-runs',
            });
            if (issues.length > 0) return; // don't spam — one open alert at a time
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Nightly conformance failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['cloud-runs'],
            });
