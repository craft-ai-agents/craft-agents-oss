name: Validate

on:
  pull_request:
  push:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the smoke OS list: the test-suite matrix
  # fans out from this output and the smoke script's --diff derives its
  # expected report set from the same output, so adding or removing an OS
  # here is the only edit needed — no keep-in-sync drift between them.
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      os_list: ${{ steps.set.outputs.os_list }}
    steps:
      - id: set
        run: echo 'os_list=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"

  # Heavy static validation (typecheck:all, i18n lints, icon/anim checks).
  # Deliberately PR-only (see commit 90710df5) — the full test suite is the
  # every-push gate, enforced by the test-suite job below.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Reject Windows-illegal filenames
        run: |
          BAD=$(git ls-files | grep -E '[<>:"|?*]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files with characters illegal on Windows:"
            echo "$BAD"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bun run validate:ci

  # Full test suite on every push and PR. Runs the exact repo test command
  # (`bun test packages scripts apps/cli/src apps/electron/src
  # apps/electron/eslint-rules && bun scripts/run-isolated-tests.mjs` — the
  # package.json "test" script), including the isolated runner that spawns
  # each *.isolated.ts in its own process. windows-latest enforces the
  # bun 1.3.10 / Windows test-infra fixes this branch introduced.
  test-suite:
    name: test-suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [os-matrix]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.os-matrix.outputs.os_list) }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full test suite (owned roots + isolated runner)
        run: bun run test

      # Cross-platform smoke (aj-geddes Quick Start fixture + repo path/env
      # bug classes) on the same matrix as the suite above. Each OS writes a
      # readable report that cross-platform-divergence diffs below. Runs even
      # when the suite above fails: the script writes its report before
      # exiting non-zero, so a red leg still uploads an artifact the
      # divergence job can compare.
      - name: Run cross-platform smoke
        if: always()
        run: bun scripts/cross-platform-smoke.mjs --json smoke-report-${{ matrix.os }}.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: smoke-report-${{ matrix.os }}.json
          if-no-files-found: error

  # Diffs the per-OS smoke reports. A probe that passes on linux but
  # fails on windows (or is missing from one OS) is named in the workflow log
  # — the divergence contract that turns future Windows bug-class regressions
  # into workflow noise instead of postmortems. Runs even when a matrix leg
  # fails (if: always): a red suite is exactly when named divergence output
  # matters most, and --diff already reports missing/unparseable reports.
  cross-platform-divergence:
    name: cross-platform smoke divergence check
    runs-on: ubuntu-latest
    needs: [test-suite, os-matrix]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Download smoke reports
        uses: actions/download-artifact@v4
        with:
          path: smoke-reports
          pattern: smoke-report-*
          merge-multiple: true

      # The script owns missing-report detection: --expected-os names the
      # full matrix set (from the os-matrix single source), and a leg that
      # died before uploading leaves a gap the script names and fails on.
      # A green "no divergence" line is therefore trustworthy, with no
      # separate workflow gate to drift out of sync.
      - name: Diff smoke reports across OSes
        if: always()
        env:
          EXPECTED_OS: "${{ join(fromJSON(needs.os-matrix.outputs.os_list), ',') }}"
        run: |
          shopt -s nullglob
          bun scripts/cross-platform-smoke.mjs --diff --expected-os "$EXPECTED_OS" smoke-reports/*.json
