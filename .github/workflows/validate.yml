# Compatibility shim: keeps the historical "Validate" workflow name green.
# Real work lives in ci.yml (contracts / validate / build / ci-ok).
# Prefer requiring "ci-ok" in branch protection.
name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'redesign/**'
  workflow_dispatch:

concurrency:
  group: validate-shim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (legacy single-job)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Full validate:ci
        run: bun run validate:ci
