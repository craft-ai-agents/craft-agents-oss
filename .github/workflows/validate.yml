name: Validate

on:
  pull_request:
  push:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Heavy static validation (typecheck:all, i18n lints, icon/anim checks).
  # Deliberately PR-only (see commit 90710df5) — the full test suite is the
  # every-push gate, enforced by the test-suite job below.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Reject Windows-illegal filenames
        run: |
          BAD=$(git ls-files | grep -E '[<>:"|?*]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files with characters illegal on Windows:"
            echo "$BAD"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bun run validate:ci

  # Full test suite on every push and PR. Runs the exact repo test command
  # (`bun test packages scripts apps/cli/src apps/electron/src
  # apps/electron/eslint-rules && bun scripts/run-isolated-tests.mjs` — the
  # package.json "test" script), including the isolated runner that spawns
  # each *.isolated.ts in its own process. windows-latest enforces the
  # bun 1.3.10 / Windows test-infra fixes this branch introduced.
  test-suite:
    name: test-suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full test suite (owned roots + isolated runner)
        run: bun run test

      # Cross-platform smoke (aj-geddes Quick Start fixture + repo path/env
      # bug classes) on the same 3-OS matrix. Each OS writes a machine-
      # readable report that cross-platform-divergence diffs below. Runs even
      # when the suite above fails: the script writes its report before
      # exiting non-zero, so a red leg still uploads an artifact the
      # divergence job can compare.
      - name: Run cross-platform smoke
        if: always()
        run: bun scripts/cross-platform-smoke.mjs --json smoke-report-${{ matrix.os }}.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: smoke-report-${{ matrix.os }}.json
          if-no-files-found: error

  # Diffs the three per-OS smoke reports. A probe that passes on linux but
  # fails on windows (or is missing from one OS) is named in the workflow log
  # — the divergence contract that turns future Windows bug-class regressions
  # into workflow noise instead of postmortems. Runs even when a matrix leg
  # fails (if: always): a red suite is exactly when named divergence output
  # matters most, and --diff already reports missing/unparseable reports.
  cross-platform-divergence:
    name: cross-platform smoke divergence check
    runs-on: ubuntu-latest
    needs: [test-suite]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Download smoke reports
        uses: actions/download-artifact@v4
        with:
          path: smoke-reports
          pattern: smoke-report-*
          merge-multiple: true

      # The diff below only compares the reports it receives, so a leg that
      # died before uploading would otherwise be silently absent — the job
      # would compare 2 reports and report "no divergence", missing the OS
      # whose regression it exists to name. This gate fails loudly when any
      # expected report is missing, so the divergence contract holds even
      # when a matrix leg itself is red.
      #
      # NOTE: the OS list below must stay in sync with the test-suite
      # matrix.os values above — the divergence job isn't a matrix job, so
      # it can't reference ${{ matrix.os }} directly.
      - name: Verify all three OS reports present
        if: always()
        run: |
          MISSING=""
          for os in ubuntu-latest windows-latest macos-latest; do
            if [ ! -f "smoke-reports/smoke-report-$os.json" ]; then
              MISSING="${MISSING:+$MISSING }$os"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing smoke report(s) for: $MISSING — the diff below is incomplete"
            exit 1
          fi
          echo "All 3 OS smoke reports present."

      - name: Diff smoke reports across OSes
        # Runs even when the presence gate above failed, so the partial
        # picture is still printed alongside the named missing-OS error.
        # Note: a green "no divergence" line here does NOT mean the job
        # passed when the gate above errored — the job fails on any red step.
        if: always()
        run: |
          COUNT=$(ls smoke-reports/*.json 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Only $COUNT smoke report(s) available — cannot diff. Check the matrix legs."
            exit 1
          fi
          bun scripts/cross-platform-smoke.mjs --diff smoke-reports/*.json
