<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jonwork — Login</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#1F1F24" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f8f8fa;
      --page-fg: #1a1a2e;
      --card-bg: rgba(255, 255, 255, 0.86);
      --card-border: rgba(228, 228, 232, 0.9);
      --card-shadow: 0 32px 96px rgba(41, 25, 63, 0.14), 0 16px 40px rgba(41, 25, 63, 0.08);
      --subtitle: rgba(26, 26, 46, 0.56);
      --input-bg: rgba(255, 255, 255, 0.72);
      --input-border: rgba(212, 212, 216, 0.95);
      --placeholder: rgba(26, 26, 46, 0.34);
      --accent: #6d5dfc;
      --accent-hover: #5a4be0;
      --ambient-strong: rgba(104, 78, 133, 0.18);
      --ambient-soft: rgba(104, 78, 133, 0.1);
      --grain-1: rgba(104, 78, 133, 0.055);
      --grain-2: rgba(104, 78, 133, 0.03);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-fg: #b91c1c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: var(--page-bg);
      color: var(--page-fg);
      padding: 16px;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      inset: -18%;
      background:
        radial-gradient(circle at 18% 20%, var(--ambient-strong) 0, transparent 34%),
        radial-gradient(circle at 82% 18%, var(--ambient-soft) 0, transparent 28%),
        radial-gradient(circle at 76% 76%, rgba(104, 78, 133, 0.16) 0, transparent 34%),
        radial-gradient(circle at 30% 78%, rgba(104, 78, 133, 0.11) 0, transparent 30%);
      filter: blur(44px);
      opacity: 0.95;
      transform: scale(1.08);
      animation: drift 24s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(104, 78, 133, 0.06), transparent 58%),
        repeating-linear-gradient(135deg, var(--grain-1) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(45deg, var(--grain-2) 0 1px, transparent 1px 11px);
      opacity: 0.45;
      mix-blend-mode: multiply;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 28rem;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    .brand-mark {
      display: block;
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 20rem;
      font-size: 13px;
      line-height: 1.5;
      color: var(--subtitle);
    }

    .primary-link,
    .secondary-link {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .primary-link {
      padding: 11px 12px;
      color: white;
      background: linear-gradient(180deg, #7b6dff 0%, var(--accent) 100%);
      box-shadow: 0 10px 24px rgba(109, 93, 252, 0.28);
    }

    .secondary-link {
      margin-top: 12px;
      padding: 9px 12px;
      color: var(--page-fg);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
    }

    .tabs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      margin-bottom: 22px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(127, 127, 140, 0.1);
    }

    .tabs button {
      margin: 0;
      padding: 8px;
      color: var(--subtitle);
      background: transparent;
      box-shadow: none;
    }

    .tabs button.active {
      color: var(--page-fg);
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(41, 25, 63, 0.1);
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--page-fg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.1);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: white;
      background: linear-gradient(180deg, #7b6dff 0%, var(--accent) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, background 0.15s;
      box-shadow: 0 10px 24px rgba(109, 93, 252, 0.28);
    }

    button:hover {
      background: linear-gradient(180deg, #705fff 0%, var(--accent-hover) 100%);
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-fg);
    }

    .error.visible { display: block; }

    @keyframes drift {
      from { transform: scale(1.08) translate3d(-2%, -1%, 0); }
      to { transform: scale(1.12) translate3d(2%, 1.5%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      button {
        transition: background 0.15s;
      }

      button:hover {
        transform: none;
        filter: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f0f14;
        --page-fg: #e0e0e8;
        --card-bg: rgba(26, 26, 34, 0.82);
        --card-border: rgba(42, 42, 53, 0.95);
        --card-shadow: 0 32px 96px rgba(0, 0, 0, 0.42), 0 16px 40px rgba(0, 0, 0, 0.24);
        --subtitle: rgba(224, 224, 232, 0.64);
        --input-bg: rgba(15, 15, 20, 0.72);
        --input-border: rgba(42, 42, 53, 0.95);
        --placeholder: rgba(224, 224, 232, 0.32);
        --ambient-strong: rgba(155, 123, 184, 0.22);
        --ambient-soft: rgba(155, 123, 184, 0.12);
        --grain-1: rgba(155, 123, 184, 0.06);
        --grain-2: rgba(155, 123, 184, 0.035);
        --error-bg: #2d1a1a;
        --error-border: #5a2020;
        --error-fg: #f5a0a0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="brand-mark" src="./icon-192.png" alt="Jonwork">
    <h1>Jonwork</h1>
    <p class="subtitle" id="subtitle">登录你的 Jonwork 账户</p>

    <div class="tabs" role="tablist" hidden>
      <button type="button" id="login-tab" class="active">登录</button>
      <button type="button" id="register-tab" hidden>注册</button>
    </div>

    <a class="primary-link" id="erp-login" href="/api/auth/sso/start" hidden>使用 ERPNext 企业账号登录</a>
    <form id="login-form" hidden>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="3–32 个字符" maxlength="32" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" maxlength="128" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submit-btn">登录</button>
    </form>

    <div id="error" class="error"></div>
    <a class="secondary-link" href="/downloads/Jonwork-Setup-x64.exe">下载 Windows 客户端</a>
    <p class="subtitle" id="enrollment-note">账号开通或密码重置，请联系企业管理员。</p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const subtitle = document.getElementById('subtitle');
    const passwordInput = document.getElementById('password');
    let mode = 'login';
    let allowRegistration = false;

    fetch('/api/auth/policy', { cache: 'no-store' })
      .then(res => res.ok ? res.json() : null)
      .then(policy => {
        if (policy?.sso === true) {
          document.getElementById('erp-login').hidden = false;
          subtitle.textContent = '账号、权限和额度由 ERPNext 统一管理';
        } else {
          form.hidden = false;
          document.querySelector('.tabs').hidden = false;
        }
        allowRegistration = policy?.allowRegistration === true;
        registerTab.hidden = !allowRegistration;
      })
      .catch(() => {
        subtitle.textContent = '无法确认 ERPNext 登录策略，请稍后重试或联系管理员';
        errorEl.textContent = '为保护企业账号，未确认登录策略时不开放 Craft 密码登录。';
        errorEl.classList.add('visible');
      });

    function setMode(nextMode) {
      if (nextMode === 'register' && !allowRegistration) return;
      mode = nextMode;
      const registering = mode === 'register';
      loginTab.classList.toggle('active', !registering);
      registerTab.classList.toggle('active', registering);
      subtitle.textContent = registering ? '创建你的 Jonwork 账户' : '登录你的 Jonwork 账户';
      submitBtn.textContent = registering ? '注册并进入' : '登录';
      passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
      passwordInput.minLength = registering ? 12 : 1;
      passwordInput.placeholder = registering ? '12–128 个字符' : '请输入密码';
      errorEl.classList.remove('visible');
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = mode === 'register' ? '正在注册...' : '正在登录...';

      try {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch(mode === 'register' ? '/api/auth/register' : '/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Authentication failed';
        errorEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'register' ? '注册并进入' : '登录';
      }
    });
  </script>
</body>
</html>
