<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Craft Agents — Login</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#1F1F24" />
  <style>
    /* system font stack — no Google Fonts (GFW blocked, triggers Feishu security warning) */
    @font-face {
      font-family: 'Inter-fallback';
      src: local('Inter'), local('system-ui'), local('-apple-system'), local('BlinkMacSystemFont');
    }
  </style>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f8f8fa;
      --page-fg: #1a1a2e;
      --card-bg: rgba(255, 255, 255, 0.86);
      --card-border: rgba(228, 228, 232, 0.9);
      --card-shadow: 0 32px 96px rgba(41, 25, 63, 0.14), 0 16px 40px rgba(41, 25, 63, 0.08);
      --subtitle: rgba(26, 26, 46, 0.56);
      --input-bg: rgba(255, 255, 255, 0.72);
      --input-border: rgba(212, 212, 216, 0.95);
      --placeholder: rgba(26, 26, 46, 0.34);
      --accent: #6d5dfc;
      --accent-hover: #5a4be0;
      --ambient-strong: rgba(104, 78, 133, 0.18);
      --ambient-soft: rgba(104, 78, 133, 0.1);
      --grain-1: rgba(104, 78, 133, 0.055);
      --grain-2: rgba(104, 78, 133, 0.03);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-fg: #b91c1c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: var(--page-bg);
      color: var(--page-fg);
      padding: 16px;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      inset: -18%;
      background:
        radial-gradient(circle at 18% 20%, var(--ambient-strong) 0, transparent 34%),
        radial-gradient(circle at 82% 18%, var(--ambient-soft) 0, transparent 28%),
        radial-gradient(circle at 76% 76%, rgba(104, 78, 133, 0.16) 0, transparent 34%),
        radial-gradient(circle at 30% 78%, rgba(104, 78, 133, 0.11) 0, transparent 30%);
      filter: blur(44px);
      opacity: 0.95;
      transform: scale(1.08);
      animation: drift 24s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(104, 78, 133, 0.06), transparent 58%),
        repeating-linear-gradient(135deg, var(--grain-1) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(45deg, var(--grain-2) 0 1px, transparent 1px 11px);
      opacity: 0.45;
      mix-blend-mode: multiply;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 28rem;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 20rem;
      font-size: 13px;
      line-height: 1.5;
      color: var(--subtitle);
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--page-fg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.1);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: white;
      background: linear-gradient(180deg, #7b6dff 0%, var(--accent) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, background 0.15s;
      box-shadow: 0 10px 24px rgba(109, 93, 252, 0.28);
    }

    button:hover {
      background: linear-gradient(180deg, #705fff 0%, var(--accent-hover) 100%);
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-fg);
    }

    .error.visible { display: block; }

    @keyframes drift {
      from { transform: scale(1.08) translate3d(-2%, -1%, 0); }
      to { transform: scale(1.12) translate3d(2%, 1.5%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      button {
        transition: background 0.15s;
      }

      button:hover {
        transform: none;
        filter: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f0f14;
        --page-fg: #e0e0e8;
        --card-bg: rgba(26, 26, 34, 0.82);
        --card-border: rgba(42, 42, 53, 0.95);
        --card-shadow: 0 32px 96px rgba(0, 0, 0, 0.42), 0 16px 40px rgba(0, 0, 0, 0.24);
        --subtitle: rgba(224, 224, 232, 0.64);
        --input-bg: rgba(15, 15, 20, 0.72);
        --input-border: rgba(42, 42, 53, 0.95);
        --placeholder: rgba(224, 224, 232, 0.32);
        --ambient-strong: rgba(155, 123, 184, 0.22);
        --ambient-soft: rgba(155, 123, 184, 0.12);
        --grain-1: rgba(155, 123, 184, 0.06);
        --grain-2: rgba(155, 123, 184, 0.035);
        --error-bg: #2d1a1a;
        --error-border: #5a2020;
        --error-fg: #f5a0a0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Craft Agents</h1>
    <p class="subtitle" id="subtitle">Use Feishu to continue</p>

    <button type="button" id="feishu-btn" style="display:none">Continue with Feishu</button>

    <form id="login-form" style="display:none">
      <label for="password">Server Token</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter CRAFT_SERVER_TOKEN"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit" id="submit-btn" class="secondary">Sign In</button>
    </form>

    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const feishuBtn = document.getElementById('feishu-btn');
    const subtitle = document.getElementById('subtitle');

    let feishuConfig = null;
    const oauthStateKey = 'feishu_oauth_state';
    const oauthAppKeyKey = 'feishu_oauth_appKey';

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    function clearError() {
      errorEl.classList.remove('visible');
    }

    function isFeishuWebviewUnavailable(err) {
      return err?.code === 'FEISHU_WEBVIEW_UNAVAILABLE';
    }

    function isPasswordOnlyRequested() {
      return new URLSearchParams(window.location.search).get('pw') === '1';
    }

    function setFeishuButtonIdleText() {
      feishuBtn.textContent = feishuConfig?.domain === 'lark'
        ? 'Continue with Lark'
        : 'Continue with Feishu / 飞书登录';
    }

    function showPasswordFallback(message) {
      form.style.display = '';
      subtitle.textContent = message || 'Enter your server token to continue';
    }

    function cleanOAuthCallbackUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('code');
      url.searchParams.delete('state');
      const next = url.pathname + (url.search ? url.search : '') + url.hash;
      window.history.replaceState({}, document.title, next);
    }

    function generateOAuthState() {
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function startFeishuOAuthRedirect(active) {
      if (!active?.appId) {
        showError('Feishu application is not configured.');
        return;
      }
      const state = generateOAuthState();
      sessionStorage.setItem(oauthStateKey, state);
      sessionStorage.setItem(oauthAppKeyKey, active.key || '');

      const authorizeUrl = new URL(feishuConfig?.domain === 'lark'
        ? 'https://accounts.larksuite.com/open-apis/authen/v1/authorize'
        : 'https://accounts.feishu.cn/open-apis/authen/v1/authorize');
      authorizeUrl.searchParams.set('client_id', active.appId);
      authorizeUrl.searchParams.set('redirect_uri', location.origin + '/login');
      authorizeUrl.searchParams.set('response_type', 'code');
      authorizeUrl.searchParams.set('state', state);

      window.location.href = authorizeUrl.toString();
    }

    async function handleFeishuOAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('code')) return false;

      const code = params.get('code');
      const returnedState = params.get('state');
      const storedState = sessionStorage.getItem(oauthStateKey);
      const storedAppKey = sessionStorage.getItem(oauthAppKeyKey) || undefined;

      cleanOAuthCallbackUrl();
      sessionStorage.removeItem(oauthStateKey);
      sessionStorage.removeItem(oauthAppKeyKey);

      if (!code || !storedState || returnedState !== storedState) {
        showPasswordFallback('Enter your server token to continue');
        showError('Feishu OAuth state mismatch. Please try again.');
        return true;
      }

      subtitle.textContent = 'Completing Feishu sign in...';
      feishuBtn.style.display = 'none';
      form.style.display = 'none';
      clearError();

      try {
        const res = await fetch('/api/auth/feishu/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            code,
            appKey: storedAppKey,
            flow: 'oauth',
            redirectUri: location.origin + '/login',
          }),
        });
        if (res.ok) {
          window.location.href = '/';
          return true;
        }
        const data = await res.json().catch(() => ({}));
        showPasswordFallback('Enter your server token to continue');
        showError(data.error || 'Feishu authentication failed');
      } catch (err) {
        showPasswordFallback('Enter your server token to continue');
        showError('Network error — is the server running?');
      }
      return true;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error', reject, { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load Feishu JS SDK'));
        document.head.appendChild(script);
      });
    }

    async function ensureFeishuSdk(domain) {
      if (window.tt?.requestAccess) return;
      const src = domain === 'lark'
        ? 'https://lf16-lark-web.ibytedtos.com/obj/lark-web-op/h5-js-sdk-1.5.42.js'
        : 'https://lf1-cdn-tos.bytegoofy.com/obj/goofy/lark/op/h5-js-sdk-1.5.42.js';
      await loadScript(src);
    }

    function requestFeishuCode(appId) {
      return new Promise((resolve, reject) => {
        const run = () => {
          const tt = window.tt;
          if (!tt?.requestAccess) {
            const err = new Error('Feishu login is only available inside the Feishu/Lark client.');
            err.code = 'FEISHU_WEBVIEW_UNAVAILABLE';
            reject(err);
            return;
          }
          tt.requestAccess({
            appID: appId,
            scopeList: [],
            success: (res) => {
              if (res?.code) resolve(res.code);
              else reject(new Error('Feishu did not return an authorization code.'));
            },
            fail: (err) => {
              // Surface the real cause: Feishu hides the reason in err.errno/errString
              // behind a useless "please check errno" errMsg.
              let detail; try { detail = JSON.stringify(err); } catch (e) { detail = String(err); }
              reject(new Error((err?.errMsg || err?.message || 'Feishu authorization failed.') + ' [appID=' + appId + ' errno=' + (err?.errno ?? '?') + ' ' + detail + ']'));
            },
          });
        };

        if (window.h5sdk?.ready) {
          window.h5sdk.ready(run);
          window.h5sdk.error((err) => reject(new Error(err?.errMsg || err?.message || 'Feishu JS SDK is not ready.')));
        } else {
          run();
        }
      });
    }

    // Pick the app this webview belongs to. Multi-app: read ?app=<key> and match
    // feishuConfig.apps; fall back to the first app, then to the legacy single appId.
    function resolveActiveApp(cfg) {
      const apps = Array.isArray(cfg?.apps) ? cfg.apps : [];
      if (apps.length === 0) {
        return cfg?.appId ? { key: undefined, appId: cfg.appId } : null;
      }
      const wanted = new URLSearchParams(window.location.search).get('app');
      return (wanted && apps.find((a) => a.key === wanted)) || apps[0];
    }

    async function signInWithFeishu() {
      const active = resolveActiveApp(feishuConfig);
      if (!feishuConfig?.enabled || !active) return;
      clearError();
      feishuBtn.disabled = true;
      feishuBtn.textContent = window.tt?.requestAccess ? 'Signing in with Feishu...' : 'Redirecting to Feishu...';

      try {
        if (!window.tt?.requestAccess) {
          startFeishuOAuthRedirect(active);
          return;
        }
        await ensureFeishuSdk(feishuConfig.domain);
        const code = await requestFeishuCode(active.appId);
        const res = await fetch('/api/auth/feishu/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ code, appKey: active.key }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        showError(data.error || 'Feishu authentication failed');
      } catch (err) {
        showError(err instanceof Error ? err.message : 'Feishu authentication failed');
      } finally {
        feishuBtn.disabled = false;
        setFeishuButtonIdleText();
      }
    }

    async function signInWithFeishuInWebview() {
      const active = resolveActiveApp(feishuConfig);
      if (!feishuConfig?.enabled || !active) return;
      clearError();
      feishuBtn.disabled = true;
      feishuBtn.textContent = 'Signing in with Feishu...';

      try {
        await ensureFeishuSdk(feishuConfig.domain);
        const code = await requestFeishuCode(active.appId);
        const res = await fetch('/api/auth/feishu/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ code, appKey: active.key }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        showError(data.error || 'Feishu authentication failed');
      } catch (err) {
        if (isFeishuWebviewUnavailable(err) || !window.tt?.requestAccess) {
          showPasswordFallback(feishuConfig.domain === 'lark'
            ? 'Use Lark to continue or enter your server token'
            : 'Use Feishu to continue or enter your server token');
        } else {
          showError(err instanceof Error ? err.message : 'Feishu authentication failed');
        }
      } finally {
        feishuBtn.disabled = false;
        setFeishuButtonIdleText();
      }
    }

    async function loadAuthConfig() {
      try {
        const res = await fetch('/api/auth/feishu/config', { credentials: 'same-origin' });
        feishuConfig = await res.json();
      } catch {
        feishuConfig = { enabled: false, passwordFallback: true };
      }

      if (feishuConfig.enabled) {
        if (isPasswordOnlyRequested()) {
          feishuBtn.style.display = 'none';
          showPasswordFallback('Enter your server token to continue');
          return;
        }

        feishuBtn.style.display = '';
        setFeishuButtonIdleText();
        form.style.display = feishuConfig.passwordFallback || !window.tt?.requestAccess ? '' : 'none';
        subtitle.textContent = feishuConfig.domain === 'lark'
          ? 'Use Lark to continue'
          : 'Use Feishu to continue';
        void signInWithFeishuInWebview();
      } else {
        showPasswordFallback('Enter your server token to continue');
      }
    }

    feishuBtn.addEventListener('click', () => {
      void signInWithFeishu();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const password = document.getElementById('password').value;
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        showError(data.error || 'Authentication failed');
      } catch (err) {
        showError('Network error — is the server running?');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    (async () => {
      const handledOAuthCallback = await handleFeishuOAuthCallback();
      if (!handledOAuthCallback) {
        await loadAuthConfig();
      }
    })();
  </script>
</body>
</html>
