<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHstudio Brand Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-width: 200px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>ARCHstudio Brand Preview</h1>

  <div class="row">
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sym-a-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00E676" />
            <stop offset="100%" stop-color="#00C853" />
          </linearGradient>
          <linearGradient id="sym-a-right" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8C42FF" />
            <stop offset="100%" stop-color="#651FFF" />
          </linearGradient>
        </defs>
        <path d="M 21.15 4.25 A 18 18 0 0 0 21.15 43.75" stroke="url(#sym-a-left)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 26.85 4.25 A 18 18 0 0 1 26.85 43.75" stroke="url(#sym-a-right)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M24 8 L12 38 H17 L24 20 L24 8 Z" fill="url(#sym-a-left)"/>
        <path d="M24 8 L24 20 L31 38 H36 L24 8 Z" fill="url(#sym-a-right)"/>
        <rect x="15" y="25" width="18" height="3.5" rx="1" fill="#8C42FF"/>
        <path d="M24 30 L26.5 34 L24 39 L21.5 34 Z" fill="#651FFF"/>
      </svg>
      <span class="label">Symbol 48px</span>
    </div>

    <div class="card">
      <svg width="96" height="96" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sym-a-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00E676" />
            <stop offset="100%" stop-color="#00C853" />
          </linearGradient>
          <linearGradient id="sym-a-right" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8C42FF" />
            <stop offset="100%" stop-color="#651FFF" />
          </linearGradient>
        </defs>
        <path d="M 21.15 4.25 A 18 18 0 0 0 21.15 43.75" stroke="url(#sym-a-left)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 26.85 4.25 A 18 18 0 0 1 26.85 43.75" stroke="url(#sym-a-right)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M24 8 L12 38 H17 L24 20 L24 8 Z" fill="url(#sym-a-left)"/>
        <path d="M24 8 L24 20 L31 38 H36 L24 8 Z" fill="url(#sym-a-right)"/>
        <rect x="15" y="25" width="18" height="3.5" rx="1" fill="#8C42FF"/>
        <path d="M24 30 L26.5 34 L24 39 L21.5 34 Z" fill="#651FFF"/>
      </svg>
      <span class="label">Symbol 96px</span>
    </div>

    <div class="card">
      <svg width="256" height="40" viewBox="0 0 320 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arch-a-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00E676" />
            <stop offset="100%" stop-color="#00C853" />
          </linearGradient>
          <linearGradient id="arch-a-right" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8C42FF" />
            <stop offset="100%" stop-color="#651FFF" />
          </linearGradient>
        </defs>
        <g transform="translate(6, 6) scale(0.75)">
          <path d="M 21.15 4.25 A 18 18 0 0 0 21.15 43.75" stroke="url(#arch-a-left)" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M 26.85 4.25 A 18 18 0 0 1 26.85 43.75" stroke="url(#arch-a-right)" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M24 8 L12 38 H17 L24 20 L24 8 Z" fill="url(#arch-a-left)"/>
          <path d="M24 8 L24 20 L31 38 H36 L24 8 Z" fill="url(#arch-a-right)"/>
          <rect x="15" y="25" width="18" height="3.5" rx="1" fill="#8C42FF"/>
          <path d="M24 30 L26.5 34 L24 39 L21.5 34 Z" fill="#651FFF"/>
        </g>
        <text x="54" y="33" font-family="Inter, SF Pro Display, Segoe UI, Roboto, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">
          <tspan fill="#00E676">ARCH</tspan>
          <tspan fill="#8C42FF" dx="2">studio</tspan>
        </text>
      </svg>
      <span class="label">Wordmark 256px</span>
    </div>
  </div>

  <div class="card" style="width: fit-content;">
    <svg width="256" height="256" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="96" fill="#111111"/>
      <g transform="translate(256, 256) scale(5.5) translate(-24, -24)">
        <path d="M 21.15 4.25 A 18 18 0 0 0 21.15 43.75" stroke="url(#al)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 26.85 4.25 A 18 18 0 0 1 26.85 43.75" stroke="url(#ar)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M24 8 L12 38 H17 L24 20 L24 8 Z" fill="url(#al)"/>
        <path d="M24 8 L24 20 L31 38 H36 L24 8 Z" fill="url(#ar)"/>
        <rect x="15" y="25" width="18" height="3.5" rx="1" fill="#8C42FF"/>
        <path d="M24 30 L26.5 34 L24 39 L21.5 34 Z" fill="#651FFF"/>
      </g>
      <defs>
        <linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00C853"/></linearGradient>
        <linearGradient id="ar" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8C42FF"/><stop offset="100%" stop-color="#651FFF"/></linearGradient>
      </defs>
    </svg>
    <span class="label">App Icon 256px</span>
  </div>
</body>
</html>
