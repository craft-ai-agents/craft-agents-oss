<!DOCTYPE html>
<!--
  apps/electron/playwright/affordances/refreshing-badge.html

  Captures the `wd-files-refreshing-badge` pill in its live state —
  appears inline in the Working Directory section header when
  `wdRefreshLoading === true` (LayoutShell.tsx:755). The DOM below
  mirrors the production JSX:

    <span class="wd-files-refreshing-badge"
          title="Re-reading expanded directories after a file change…">
      <RefreshCw size={9} className="arch-changes-spinner" />
      <span>Refreshing</span>
    </span>

  Layout: pill sits between the section header title row and the file
  count, identical to production. The wrapped element is the badge
  itself plus the surrounding header chrome so the snapshot reflects
  where in the rail it appears.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Refreshing badge — live</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Page-local: section header background and the file-count chip
         so the badge sits in the same horizontal lane it would in
         production. */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 10px;
        border-radius: 4px;
        background: transparent;
      }
      .section-header__title {
        font-size: 11px;
        font-weight: 600;
        color: var(--foreground);
        letter-spacing: 0.02em;
        margin-right: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .arch-file-list__count {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--shell-text-dim);
      }
      .arch-file-list__action {
        font-size: 9px;
        font-weight: 600;
        color: var(--shell-text-dim);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="affordance-stage">
      <span class="affordance-stage__label">Refreshing badge — refresh in flight</span>

      <div class="refreshing-badge-affordance">
        <div class="section-header">
          <span class="section-header__title">
            Working Directory
            <!-- The badge itself: RefreshCw spinner spinning + label.
                 Mirrors LayoutShell.tsx:2755 verbatim. -->
            <span
              class="wd-files-refreshing-badge"
              title="Re-reading expanded directories after a file change…"
              aria-live="polite"
            >
              <!-- RefreshCw size=9: inline SVG.  The CSS class
                   `.arch-changes-spinner` rotates it via @keyframes
                   (see styles.css).  Playwright's animations-
                   disabled mode freezes the rotation in its
                   mid-frame for deterministic snapshots. -->
              <svg
                class="arch-changes-spinner"
                xmlns="http://www.w3.org/2000/svg"
                width="9"
                height="9"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 16h5v5"></path>
              </svg>
              <span>Refreshing</span>
            </span>
          </span>
          <span class="arch-file-list__count">7</span>
          <button type="button" class="arch-file-list__action">Collapse all</button>
        </div>
      </div>
    </div>
  </body>
</html>
