# Static source catalog for scrape-engine.
# This file is the home for platform capability and known website availability.
# Runtime truth still comes from engine rows/errors/blocked/availability_status for each run.

schema_version: 1

status_values:
  enabled: adapter is registered and should be attempted when selected
  limited: adapter/source exists, but the site is known to be access-sensitive
  reference_only: useful for original/manufacturer reference, not stock/price
  deprecated: not an effective stock source; use replacement channels instead

sources:
  digikey:
    display_name: DigiKey
    tier: core
    channel_type: global_distributor
    categories: [semiconductor, passive, connector, electromechanical]
    status: enabled
    user_status: API 源；运行环境必须提供 DIGIKEY_CLIENT_ID / DIGIKEY_CLIENT_SECRET

  mouser:
    display_name: Mouser
    tier: core
    channel_type: global_distributor
    categories: [semiconductor, passive, connector, electromechanical]
